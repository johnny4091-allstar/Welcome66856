<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="Kestrel Player: play your own Xtream Codes or M3U playlist on Android TV and phones.">
  <title>Kestrel Player</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <nav id="sidebar" class="sidebar" aria-label="Main">
      <div class="brand"><img src="icons/icon.svg" alt="" width="34" height="34"><span>Kestrel</span></div>
      <button class="nav-btn" data-view="live"><span class="ico">📺</span><span class="lbl">Live TV</span></button>
      <button class="nav-btn" data-view="movies"><span class="ico">🎬</span><span class="lbl">Movies</span></button>
      <button class="nav-btn" data-view="series"><span class="ico">🎞️</span><span class="lbl">Series</span></button>
      <button class="nav-btn" data-view="favorites"><span class="ico">★</span><span class="lbl">Favourites</span></button>
      <button class="nav-btn" data-view="search"><span class="ico">🔍</span><span class="lbl">Search</span></button>
      <button class="nav-btn" data-view="settings"><span class="ico">⚙️</span><span class="lbl">Settings</span></button>
    </nav>

    <main id="main">
      <div id="updateBar" class="update-bar" hidden></div>
      <div id="view" class="view"></div>
    </main>
  </div>

  <!-- Modal (details, PIN, confirm) -->
  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true"><div id="modalBody"></div></div>
  </div>

  <!-- Browser fallback player (the Android app uses the native player instead) -->
  <div id="webPlayer" class="web-player" hidden>
    <video id="webVideo" controls playsinline autoplay></video>
    <div id="webPlayerTitle" class="web-player-title"></div>
    <button id="webPlayerClose" class="btn web-player-close">✕ Close</button>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="vendor/hls.min.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
